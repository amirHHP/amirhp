<!DOCTYPE html>
<html lang="{{ with .Page }}{{ with .Language }}{{ .Lang }}{{ end }}{{ else }}fa{{ end }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{{ with .Page }}{{ .Title | default site.Title }}{{ else }}{{ site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
  {{- with .Page }}
  {{- partial "templates/opengraph.html" . }}
  {{- partial "templates/twitter_cards.html" . }}
  {{- end }}
</head>
<body>
  <p>Redirecting to <a href="{{ .Permalink }}">{{ with .Page }}{{ .Title | default $.Permalink }}{{ else }}{{ .Permalink }}{{ end }}</a>...</p>
</body>
</html>
