    description: "یادداشت‌ها و تجربیات امیر حسین حسینی (امیر اچ پی) در حوزه مدیریت محصول، استارتاپ، فناوری، نرم‌افزار آزاد و کتاب‌ها."
    displayFullLangName: true
    images: ["images/avatar.jpg"]
    homeInfoParams:
        Title: امیر اچ پی 👨‍💻✈️🚀🏕️🧳
        Avatar: /images/avatar.jpg
        Content: |
          مدیر محصول و هم‌بنیان‌گذار سابق؛ سال‌ها خبرنگار حوزه فناوری و شیفته نرم‌افزار آزاد.  
          علاقه‌مند به برهم‌زنی و پیاده‌سازی اصلاحات تدریجی. کنجکاو در مسیر کشف ایده‌های نو، خلق محصولات مقیاس‌پذیر، سفر و یادگیری مداوم.  
          در این یادداشت‌ها از تجربه‌های مدیریت محصول، فراز و نشیب‌های استارتاپی، فناوری، کتاب‌ها و هر آنچه ذهنم را درگیر می‌کند می‌نویسم.
